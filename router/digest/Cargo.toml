[package]
name = "isureal-digest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
crc32fast = "1"
httparse = "1"
memchr = "2"
miniz_oxide = "0.8"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

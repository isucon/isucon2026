node:
  cluster: isureal-router
  id: isureal-router-envoy

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

dynamic_resources:
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    grpc_services:
      - envoy_grpc:
          cluster_name: xds_cluster

static_resources:
  listeners:
    - name: edge_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge_http
                codec_type: AUTO
                request_timeout: 30s
                normalize_path: true
                merge_slashes: true
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 172.16.0.0
                      prefix_len: 12
                rds:
                  route_config_name: isureal_routes
                  config_source:
                    ads: {}
                    resource_api_version: V3
                    initial_fetch_timeout: 15s
                http_filters:
                  - name: envoy.filters.http.fault
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                  - name: envoy.filters.http.bandwidth_limit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.bandwidth_limit.v3.BandwidthLimit
                      stat_prefix: edge_bandwidth
                      enable_mode: DISABLED
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: xds_cluster
      type: STATIC
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: xds_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 18000
    - name: app1
      type: STATIC
      connect_timeout: 2s
      load_assignment:
        cluster_name: app1
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 172.31.1.10
                      port_value: 8080
    - name: app2
      type: STATIC
      connect_timeout: 2s
      load_assignment:
        cluster_name: app2
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 172.31.2.10
                      port_value: 8080
    - name: app3
      type: STATIC
      connect_timeout: 2s
      load_assignment:
        cluster_name: app3
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 172.31.3.10
                      port_value: 8080

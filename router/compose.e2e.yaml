name: isureal-router-e2e

# HAProxy renders its configuration from the Router's environment.
x-router-environment: &router-environment
  ROUTER_PORTAL_ENDPOINT: http://portal:8080
  ROUTER_TEAM_NUMBER: "1"
  ROUTER_STATUS_LISTEN_ADDRESS: 0.0.0.0:18081
  ROUTER_HTTP_LISTEN_ADDRESS: 0.0.0.0:8080
  ROUTER_UPSTREAM_PORT: "8080"
  ROUTER_APP1_SUBNET: 172.31.1.0/24
  ROUTER_APP1_REGION_LOCAL_IP: 172.31.1.2
  ROUTER_APP1_IP: 172.31.1.10
  ROUTER_APP2_SUBNET: 172.31.2.0/24
  ROUTER_APP2_REGION_LOCAL_IP: 172.31.2.2
  ROUTER_APP2_IP: 172.31.2.10
  ROUTER_APP3_SUBNET: 172.31.3.0/24
  ROUTER_APP3_REGION_LOCAL_IP: 172.31.3.2
  ROUTER_APP3_IP: 172.31.3.10
  ROUTER_DB1_SUBNET: 172.31.4.0/24
  ROUTER_DB1_REGION_LOCAL_IP: 172.31.4.2
  ROUTER_DB1_IP: 172.31.4.10
  ROUTER_SAME_REGION_DELAY: 0s
  ROUTER_SAME_REGION_BANDWIDTH_BPS: "100000000"
  ROUTER_AP_EU_DELAY: 120ms
  ROUTER_AP_EU_BANDWIDTH_BPS: "1000000"
  ROUTER_EU_US_DELAY: 120ms
  ROUTER_EU_US_BANDWIDTH_BPS: "1000000"
  ROUTER_AP_US_DELAY: 120ms
  ROUTER_AP_US_BANDWIDTH_BPS: "1000000"
  ROUTER_COMMAND_TIMEOUT: 5s
  ROUTER_REPORT_RETRY_INTERVAL: 250ms
  ROUTER_PORTAL_RECONNECT_MIN_BACKOFF: 100ms
  ROUTER_PORTAL_RECONNECT_MAX_BACKOFF: 2s

services:
  portal:
    build:
      context: ..
      dockerfile: portal-mock/server/Dockerfile
    environment:
      PORTAL_TEAM_NUMBER: "1"
      PORTAL_TEAM_HASH: abc123
      PORTAL_DOMAIN_SUFFIX: isucon2026.westens.tokyo
      PORTAL_ROUTER_MODE: external-router
      PORTAL_APPLY_TIMEOUT_MS: "3000"
      PORTAL_LISTEN_ADDRESS: 0.0.0.0:8080
      PORTAL_WEB_DIR: ""
    networks:
      control:
        ipv4_address: 172.30.20.10
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  router:
    build:
      context: ..
      dockerfile: router/Dockerfile
      target: router
    environment: *router-environment
    depends_on:
      portal:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    security_opt:
      - no-new-privileges:true
    networks:
      control:
        ipv4_address: 172.30.20.2
      edge:
        ipv4_address: 172.30.10.2
      app1_net:
        ipv4_address: 172.31.1.2
      app2_net:
        ipv4_address: 172.31.2.2
      app3_net:
        ipv4_address: 172.31.3.2
      db1_net:
        ipv4_address: 172.31.4.2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18081/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    init: true

  haproxy:
    build:
      context: ..
      dockerfile: router/Dockerfile
      target: haproxy
    network_mode: service:router
    environment: *router-environment
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      router:
        condition: service_healthy
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  digest:
    build:
      context: ..
      dockerfile: router/Dockerfile
      target: digest
    network_mode: service:router
    environment: *router-environment
    depends_on:
      router:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: true

  app1:
    build: &fixture_build
      context: ..
      dockerfile: router/test-fixtures/server/Dockerfile
    environment:
      FIXTURE_SERVER_ID: app1
      FIXTURE_ROUTER_IP: 172.31.1.2
      FIXTURE_PEER_SUBNETS: 172.31.2.0/24,172.31.3.0/24,172.31.4.0/24
      FIXTURE_PEER_HOSTS: 172.31.1.10,172.31.2.10,172.31.3.10,172.31.4.10
    cap_drop: &fixture_cap_drop
      - ALL
    cap_add: &fixture_cap_add
      - NET_ADMIN
    security_opt: &fixture_security
      - no-new-privileges:true
    networks:
      app1_net:
        ipv4_address: 172.31.1.10
    healthcheck: &fixture_health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    init: true

  app2:
    build: *fixture_build
    environment:
      FIXTURE_SERVER_ID: app2
      FIXTURE_ROUTER_IP: 172.31.2.2
      FIXTURE_PEER_SUBNETS: 172.31.1.0/24,172.31.3.0/24,172.31.4.0/24
      FIXTURE_PEER_HOSTS: 172.31.1.10,172.31.2.10,172.31.3.10,172.31.4.10
    cap_drop: *fixture_cap_drop
    cap_add: *fixture_cap_add
    security_opt: *fixture_security
    networks:
      app2_net:
        ipv4_address: 172.31.2.10
    healthcheck: *fixture_health
    init: true

  app3:
    build: *fixture_build
    environment:
      FIXTURE_SERVER_ID: app3
      FIXTURE_ROUTER_IP: 172.31.3.2
      FIXTURE_PEER_SUBNETS: 172.31.1.0/24,172.31.2.0/24,172.31.4.0/24
      FIXTURE_PEER_HOSTS: 172.31.1.10,172.31.2.10,172.31.3.10,172.31.4.10
    cap_drop: *fixture_cap_drop
    cap_add: *fixture_cap_add
    security_opt: *fixture_security
    networks:
      app3_net:
        ipv4_address: 172.31.3.10
    healthcheck: *fixture_health
    init: true

  db1:
    build: *fixture_build
    environment:
      FIXTURE_SERVER_ID: db1
      FIXTURE_ROUTER_IP: 172.31.4.2
      FIXTURE_PEER_SUBNETS: 172.31.1.0/24,172.31.2.0/24,172.31.3.0/24
      FIXTURE_PEER_HOSTS: 172.31.1.10,172.31.2.10,172.31.3.10,172.31.4.10
    cap_drop: *fixture_cap_drop
    cap_add: *fixture_cap_add
    security_opt: *fixture_security
    networks:
      db1_net:
        ipv4_address: 172.31.4.10
    healthcheck: *fixture_health
    init: true

  e2e:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: router/tests/e2e/Dockerfile
    command: ["verify-initial"]
    depends_on:
      portal:
        condition: service_healthy
      router:
        condition: service_healthy
      haproxy:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - control
      - edge

networks:
  control:
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24
  edge:
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
  app1_net:
    internal: true
    ipam:
      config:
        - subnet: 172.31.1.0/24
  app2_net:
    internal: true
    ipam:
      config:
        - subnet: 172.31.2.0/24
  app3_net:
    internal: true
    ipam:
      config:
        - subnet: 172.31.3.0/24
  db1_net:
    internal: true
    ipam:
      config:
        - subnet: 172.31.4.0/24

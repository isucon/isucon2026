name: isureal-dev
x-app-environment: &app-environment
  ISUREAL_DB_HOST: 172.29.4.10
  ISUREAL_DB_PORT: '5432'
  ISUREAL_DB_USER: isureal
  ISUREAL_DB_PASSWORD: local-development-only
  ISUREAL_DB_NAME: isureal

x-app: &app
  build:
    context: .
    # ISUREAL_WEBAPP_LANGUAGE で起動する実装を選ぶ（deploy/dev/app-<言語>.Dockerfile）
    dockerfile: deploy/dev/app-${ISUREAL_WEBAPP_LANGUAGE:-go}.Dockerfile
  image: isureal-dev-app:local
  cpus: ${ISUREAL_APP_CPUS:-1.0}
  mem_limit: ${ISUREAL_APP_MEMORY:-1g}
  cap_add:
  - NET_ADMIN
  depends_on:
    router:
      condition: service_healthy
    db-asia:
      condition: service_healthy
  healthcheck:
    test:
    - CMD
    - curl
    - --fail
    - --silent
    - http://127.0.0.1:80/healthz
    interval: 2s
    timeout: 2s
    retries: 30
    start_period: 10s
  init: true
  restart: unless-stopped

# HAProxy renders its configuration from the Router's environment.
x-router-environment: &router-environment
  ROUTER_PORTAL_ENDPOINT: http://portal:8080
  ROUTER_TEAM_NUMBER: '1'
  ROUTER_STATUS_LISTEN_ADDRESS: 0.0.0.0:18081
  ROUTER_UPSTREAM_PORT: '80'
  ROUTER_APP_HOST: app.127.0.0.1.nip.io
  ROUTER_APP1_HOST: asia.127.0.0.1.nip.io
  ROUTER_APP2_HOST: europe.127.0.0.1.nip.io
  ROUTER_APP3_HOST: america.127.0.0.1.nip.io
  ROUTER_APP1_SUBNET: 172.29.1.0/24
  ROUTER_APP1_REGION_LOCAL_IP: 172.29.1.2
  ROUTER_APP1_IP: 172.29.1.10
  ROUTER_APP2_SUBNET: 172.29.2.0/24
  ROUTER_APP2_REGION_LOCAL_IP: 172.29.2.2
  ROUTER_APP2_IP: 172.29.2.10
  ROUTER_APP3_SUBNET: 172.29.3.0/24
  ROUTER_APP3_REGION_LOCAL_IP: 172.29.3.2
  ROUTER_APP3_IP: 172.29.3.10
  ROUTER_DB1_SUBNET: 172.29.4.0/24
  ROUTER_DB1_REGION_LOCAL_IP: 172.29.4.2
  ROUTER_DB1_IP: 172.29.4.10
  ROUTER_SAME_REGION_DELAY: 0s
  ROUTER_SAME_REGION_BANDWIDTH_BPS: ${ISUREAL_SAME_REGION_BANDWIDTH_BPS:-1000000000}
  ROUTER_AP_EU_DELAY: ${ISUREAL_AP_EU_DELAY:-100ms}
  ROUTER_AP_EU_BANDWIDTH_BPS: ${ISUREAL_AP_EU_BANDWIDTH_BPS:-200000000}
  ROUTER_EU_US_DELAY: ${ISUREAL_EU_US_DELAY:-100ms}
  ROUTER_EU_US_BANDWIDTH_BPS: ${ISUREAL_EU_US_BANDWIDTH_BPS:-200000000}
  ROUTER_AP_US_DELAY: ${ISUREAL_AP_US_DELAY:-100ms}
  ROUTER_AP_US_BANDWIDTH_BPS: ${ISUREAL_AP_US_BANDWIDTH_BPS:-200000000}
  ROUTER_COMMAND_TIMEOUT: 5s
  ROUTER_REPORT_RETRY_INTERVAL: 250ms
  ROUTER_PORTAL_RECONNECT_MIN_BACKOFF: 100ms
  ROUTER_PORTAL_RECONNECT_MAX_BACKOFF: 2s

services:
  portal:
    build:
      context: .
      dockerfile: portal-mock/server/Dockerfile
    environment:
      PORTAL_TEAM_NUMBER: '1'
      PORTAL_TEAM_HASH: abc123
      PORTAL_DOMAIN_SUFFIX: isucon2026.westens.tokyo
      PORTAL_ROUTER_MODE: external-router
      PORTAL_APPLY_TIMEOUT_MS: '3000'
      PORTAL_LISTEN_ADDRESS: 0.0.0.0:8080
      PORTAL_WEB_DIR: ''
    networks:
      control:
        ipv4_address: 172.28.20.10
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/healthz
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    init: true
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    cpus: ${ISUREAL_CONTROL_CPUS:-1.0}
    mem_limit: ${ISUREAL_CONTROL_MEMORY:-512m}
    ports:
    - 127.0.0.1:${ISUREAL_PORTAL_PORT:-18082}:8080
  router:
    build:
      context: .
      dockerfile: router/Dockerfile
      target: router
    environment: *router-environment
    depends_on:
      portal:
        condition: service_healthy
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: '1'
    security_opt:
    - no-new-privileges:true
    networks:
      control:
        ipv4_address: 172.28.20.2
      edge:
        ipv4_address: 172.28.10.2
      app-asia_net:
        ipv4_address: 172.29.1.2
      app-europe_net:
        ipv4_address: 172.29.2.2
      app-america_net:
        ipv4_address: 172.29.3.2
      db-asia_net:
        ipv4_address: 172.29.4.2
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:18081/healthz
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    init: true
    cpus: ${ISUREAL_CONTROL_CPUS:-1.0}
    mem_limit: ${ISUREAL_CONTROL_MEMORY:-512m}
    ports:
    - 127.0.0.1:${ISUREAL_HTTP_PORT:-18090}:8080
  haproxy:
    build:
      context: .
      dockerfile: router/Dockerfile
      target: haproxy
    network_mode: service:router
    environment: *router-environment
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      router:
        condition: service_healthy
      app-asia:
        condition: service_healthy
      app-europe:
        condition: service_healthy
      app-america:
        condition: service_healthy
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    cpus: ${ISUREAL_CONTROL_CPUS:-1.0}
    mem_limit: ${ISUREAL_CONTROL_MEMORY:-512m}
  app-asia:
    <<: *app
    environment:
      <<: *app-environment
      ISUREAL_REGION: asia
      ROUTER_GATEWAY: 172.29.1.2
      PEER_SUBNETS: 172.29.2.0/24 172.29.3.0/24 172.29.4.0/24
    networks:
      app-asia_net:
        ipv4_address: 172.29.1.10

  app-europe:
    <<: *app
    environment:
      <<: *app-environment
      ISUREAL_REGION: europe
      ROUTER_GATEWAY: 172.29.2.2
      PEER_SUBNETS: 172.29.1.0/24 172.29.3.0/24 172.29.4.0/24
    networks:
      app-europe_net:
        ipv4_address: 172.29.2.10

  app-america:
    <<: *app
    environment:
      <<: *app-environment
      ISUREAL_REGION: america
      ROUTER_GATEWAY: 172.29.3.2
      PEER_SUBNETS: 172.29.1.0/24 172.29.2.0/24 172.29.4.0/24
    networks:
      app-america_net:
        ipv4_address: 172.29.3.10

  db-asia:
    build:
      context: .
      dockerfile: deploy/dev/db.Dockerfile
    environment:
      POSTGRES_DB: isureal
      POSTGRES_USER: isureal
      POSTGRES_PASSWORD: local-development-only
      ROUTER_GATEWAY: 172.29.4.2
      PEER_SUBNETS: 172.29.1.0/24 172.29.2.0/24 172.29.3.0/24
    volumes:
    - dev-postgres-data:/var/lib/postgresql/data
    - ./webapp/sql/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    - ./webapp/sql/002-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    - ./webapp/sql/003-initial-snapshot.sql:/docker-entrypoint-initdb.d/003-initial-snapshot.sql:ro
    cpus: ${ISUREAL_DB_CPUS:-2.0}
    mem_limit: ${ISUREAL_DB_MEMORY:-2g}
    shm_size: 256m
    cap_add:
    - NET_ADMIN
    depends_on:
      router:
        condition: service_healthy
    networks:
      db-asia_net:
        ipv4_address: 172.29.4.10
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U isureal -d isureal
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    restart: unless-stopped
networks:
  control:
    ipam:
      config:
      - subnet: 172.28.20.0/24
  edge:
    ipam:
      config:
      - subnet: 172.28.10.0/24
  app-asia_net:
    internal: true
    ipam:
      config:
      - subnet: 172.29.1.0/24
  app-europe_net:
    internal: true
    ipam:
      config:
      - subnet: 172.29.2.0/24
  app-america_net:
    internal: true
    ipam:
      config:
      - subnet: 172.29.3.0/24
  db-asia_net:
    internal: true
    ipam:
      config:
      - subnet: 172.29.4.0/24
volumes:
  dev-postgres-data: {}

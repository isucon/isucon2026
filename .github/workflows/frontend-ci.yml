name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "frontend/**"
      - "mise.toml"
      - "mise.lock"
  pull_request:
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "frontend/**"
      - "mise.toml"
      - "mise.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  PLAYWRIGHT_CHROME_VERSION: 149.0.7827.55
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48

jobs:
  frontend-unit-build:
    runs-on: actions-runner-processor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  frontend-chrome-e2e:
    runs-on: actions-runner-processor
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check:browser && npm run test:e2e
        working-directory: frontend

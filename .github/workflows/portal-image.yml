name: Build portal image

# 競技ポータル（portal/）のコンテナイメージを isucon.sakuracr.jp に push する。
# - main の CI が緑になったら develop タグを自動で push する
# - production タグは workflow_dispatch（tag=production）で明示的に push する
# isucon2026-portal の build-image-{dev,prod}.yml に相当。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'push するタグ'
        type: choice
        options:
          - develop
          - production
        default: develop
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

env:
  IMAGE: isucon.sakuracr.jp/isucon2026-contest-portal

jobs:
  build_image:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # workflow_run では CI が走ったコミットをビルドする
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: isucon.sakuracr.jp
          username: github
          password: ${{ secrets.SAKURACR_PASSWORD }}
      - id: meta
        run: |
          sha="$(git rev-parse --short HEAD)"
          tag="${{ github.event.inputs.tag || 'develop' }}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: portal
          file: portal/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            REVISION=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

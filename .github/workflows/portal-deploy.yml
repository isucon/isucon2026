name: Deploy portal

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment environment
        type: choice
        options: [develop, production]
        default: develop
      digest:
        description: 'Existing ECR sha256 digest to redeploy (empty builds this commit)'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: portal-deploy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PORTAL_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: portal-${{ inputs.stage }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.PORTAL_ECR_REPOSITORY }}
      PORTAL_CONFIG_URI: ${{ vars.PORTAL_CONFIG_URI }}
      REQUESTED_DIGEST: ${{ inputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: kayac/ecspresso@aff803a87548687aa8e6aa0fdc45ea8f00b6fbef # v2.8.7
        with:
          version-file: portal/deploy/.ecspresso-version
      - name: Test release tooling
        run: python3 -m unittest discover -s portal/deploy/tests -v
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PORTAL_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.digest == ''
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: inputs.digest == ''
        with:
          context: portal
          file: portal/deploy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=portal-arm64
          cache-to: type=gha,mode=max,scope=portal-arm64
      - name: Deploy immutable image
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${REQUESTED_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid digest'; exit 1; }
          IMAGE_DIGEST="$digest" sh portal/deploy/deploy.sh
          echo "Deployed image: $ECR_REPOSITORY@$digest" >> "$GITHUB_STEP_SUMMARY"

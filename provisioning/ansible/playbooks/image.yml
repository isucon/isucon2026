---
- name: Build a reusable ISUCON guest role image
  hosts: all
  become: true
  gather_facts: true
  vars:
    isucon_image_build: true
    isucon_release_manifest_path: "{{ lookup('ansible.builtin.env', 'VM_RELEASE') | default(playbook_dir + '/../../config/release.json', true) }}"
    isucon_image_role: "{{ image_role | default('base') }}"
  pre_tasks:
    - name: Validate requested image role
      ansible.builtin.assert:
        that:
          - isucon_image_role in ['base', 'problem-server', 'router']
  roles:
    - role: common
    - role: problem_server
      when: isucon_image_role == 'problem-server'
    - role: router
      when: isucon_image_role == 'router'
    - role: image_cleanup

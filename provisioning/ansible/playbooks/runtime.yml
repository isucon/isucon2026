---
- name: Apply shared runtime and deterministic network policy
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
    - role: runtime_network

- name: Configure shared Asia database before applications
  hosts: db_servers
  become: true
  gather_facts: false
  roles:
    - role: problem_server

- name: Configure native application stack
  hosts: app_servers
  become: true
  gather_facts: false
  roles:
    - role: problem_server

- name: Configure native Router and Envoy stack
  hosts: routers
  become: true
  gather_facts: false
  roles:
    - role: router

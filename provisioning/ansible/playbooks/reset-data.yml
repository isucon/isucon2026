---
- name: Explicitly reset deterministic PostgreSQL application data
  hosts: problem_servers
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Stop native application services for reset
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - isureal-api.service
        - isureal-worker.service

    - name: Reset schema and deterministic fixture
      ansible.builtin.command:
        argv:
          - /opt/isucon/bin/seed
          - --dir
          - /opt/isucon/share/migrations
      environment:
        ISUREAL_DATABASE_URL: "postgresql://isureal:{{ isucon_database_password }}@127.0.0.1:5432/isureal?sslmode=disable"
      no_log: true
      changed_when: true

    - name: Start native application services after reset
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop:
        - isureal-api.service
        - isureal-worker.service

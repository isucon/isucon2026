---
- name: Explicitly reset deterministic PostgreSQL application data
  hosts: db_servers
  become: true
  gather_facts: false
  tasks:
    - name: Reset application data while guaranteeing service recovery
      block:
        - name: Stop native application services for reset
          ansible.builtin.systemd_service:
            name: "{{ item.1 }}"
            state: stopped
          delegate_to: "{{ item.0 }}"
          loop: "{{ groups['app_servers'] | product(['isureal-api.service', 'isureal-worker.service']) | list }}"

        - name: Reset schema and deterministic fixture
          ansible.builtin.command:
            argv:
              - /opt/isucon/bin/seed
              - --schema
              - /opt/isucon/share/schema.sql
          environment:
            ISUREAL_DATABASE_URL: "postgresql://isureal:{{ isucon_database_password }}@127.0.0.1:5432/isureal?sslmode=disable"
          no_log: true
          changed_when: true
      always:
        - name: Restore native application services after reset attempt
          ansible.builtin.systemd_service:
            name: "{{ item.1 }}"
            state: started
          delegate_to: "{{ item.0 }}"
          loop: "{{ groups['app_servers'] | product(['isureal-api.service', 'isureal-worker.service']) | list }}"

---
# prepare.yml が成果物を置き、各 role がここから配布する
repo_root: "{{ playbook_dir }}/../.."
build_dir: "{{ playbook_dir }}/build"
prepare_components: [webapp, frontend, datagen, router]

go_version: "1.26.5"
envoy_image: envoyproxy/envoy:v1.32.2

isureal_db_name: isureal
isureal_db_user: isureal
isureal_db_password: isureal

# Router から app の nginx へ転送するポート（webapp 本体は :8080 固定）
app_http_port: 80

# AWS のトポロジー（provisioning/aws/lib/topology.ts と一致させる）。
# 1 つの VPC でサーバーごとにサブネットを分け、サーバー間の通信は VPC のルートで
# Router のデータ用 ENI（全サーバー共通）に折り返させる
db_address: 192.168.4.10
internal_cidr: 192.168.0.0/16
public_domain: 127.0.0.1.nip.io
team_domain: "team1-aws.{{ public_domain }}"
router_data_address: 192.168.10.10
router_control_address: 192.168.20.10
servers:
  - {name: app1, cidr: 192.168.1.0/24, address: 192.168.1.10}
  - {name: app2, cidr: 192.168.2.0/24, address: 192.168.2.10}
  - {name: app3, cidr: 192.168.3.0/24, address: 192.168.3.10}
  - {name: db1, cidr: 192.168.4.0/24, address: 192.168.4.10}

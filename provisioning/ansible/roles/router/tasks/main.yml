---
# アドレスと TLS 証明書はチームごとに違うので、設定ファイルの配置とサービスの起動は user-data が行う
- name: Create Router account
  ansible.builtin.user:
    name: isureal-router
    system: true
    home: /var/lib/isureal-router
    shell: /usr/sbin/nologin

- name: Create Router directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /opt/isucon/bin, group: root, mode: "0755"}
    - {path: /etc/isucon/haproxy, group: root, mode: "0755"}
    - {path: /etc/isucon/haproxy/tls, group: isureal-router, mode: "0750"}

- name: Install binaries
  ansible.builtin.copy:
    src: "{{ build_dir }}/{{ item }}"
    dest: /opt/isucon/bin/{{ item }}
    mode: "0755"
  loop: [isureal-router, isureal-portal, isureal-digest]

# Ubuntu 24.04 の 2.8 LTS（Lua と帯域制限のフィルターが入っている）。設定は isureal-haproxy.service が起動のたびに作る
- name: Install HAProxy
  ansible.builtin.apt:
    name: haproxy

- name: Keep the packaged HAProxy service off
  ansible.builtin.systemd_service:
    name: haproxy
    state: stopped
    enabled: false
    masked: true

- name: Install systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  # isureal-digest.service は isureal-haproxy.service（Wants=）と一緒に起動する
  loop: [isureal-router.service, isureal-haproxy.service, isureal-portal.service, isureal-digest.service]

- name: Forward packets between server subnets
  ansible.builtin.copy:
    src: 90-isucon-router.conf
    dest: /etc/sysctl.d/90-isucon-router.conf
    mode: "0644"

- name: Batch ENA interrupts into NAPI polling
  ansible.builtin.copy:
    src: 90-isucon-router-napi.rules
    dest: /etc/udev/rules.d/90-isucon-router-napi.rules
    mode: "0644"

---
# アドレスと TLS 証明書はチームごとに違うので、設定ファイルの配置とサービスの起動は user-data が行う
- name: Create Router account
  ansible.builtin.user:
    name: isureal-router
    system: true
    home: /var/lib/isureal-router
    shell: /usr/sbin/nologin

- name: Create Router directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /opt/isucon/bin, group: root, mode: "0755"}
    - {path: /etc/isucon/envoy, group: root, mode: "0755"}
    - {path: /etc/isucon/envoy/tls, group: isureal-router, mode: "0750"}

- name: Install binaries
  ansible.builtin.copy:
    src: "{{ build_dir }}/{{ item }}"
    dest: /opt/isucon/bin/{{ item }}
    mode: "0755"
  loop: [isureal-router, isureal-portal, envoy]

- name: Install systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: [isureal-router.service, isureal-envoy.service, isureal-portal.service]

- name: Forward packets between server subnets
  ansible.builtin.copy:
    src: 90-isucon-router.conf
    dest: /etc/sysctl.d/90-isucon-router.conf
    mode: "0644"

---
- name: Validate runtime node network contract
  ansible.builtin.assert:
    that:
      - isucon_node_id in isucon_topology.nodes
      - isucon_node.interfaces | length == (6 if isucon_node.role == 'router' else 2)
      - isucon_node.interfaces | map(attribute='macAddress') | unique | length == isucon_node.interfaces | length

- name: Build deterministic non-bootstrap interface definitions from macAddress
  ansible.builtin.set_fact:
    isucon_network_interfaces: "{{ (isucon_network_interfaces | default([])) + [definition] }}"
  vars:
    definition:
      role: "{{ item.role }}"
      macAddress: "{{ item.macAddress }}"
      segment: "{{ item.segment }}"
      address: "{{ isucon_topology.networks[item.segment].routerAddress if isucon_node.role == 'router' else isucon_topology.networks[item.segment].peerAddress }}"
      cidr: "{{ isucon_topology.networks[item.segment].cidr }}"
  loop: "{{ isucon_node.interfaces | rejectattr('role', 'equalto', 'bootstrap0') | list }}"

- name: Build problem-server Router-only routes
  ansible.builtin.set_fact:
    isucon_network_routes: "{{ isucon_topology.networks | dict2items | rejectattr('key', 'equalto', isucon_node.interfaces[1].segment) | rejectattr('key', 'equalto', 'control') | map(attribute='value.cidr') | list }}"
  when: isucon_node.role == 'problem-server'

- name: Install persistent networkd definitions keyed by MACAddress
  ansible.builtin.template:
    src: 50-isureal.network.j2
    dest: "/etc/systemd/network/05-isureal-{{ item.role }}.network"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ isucon_network_interfaces }}"
  vars:
    isucon_network_interface: "{{ item }}"

- name: Install deterministic live network application command
  ansible.builtin.template:
    src: network-apply.sh.j2
    dest: /usr/local/sbin/isureal-network-apply
    owner: root
    group: root
    mode: "0755"

- name: Persist IPv4 forwarding policy
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-isureal-network.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward={{ 1 if isucon_node.role == 'router' else 0 }}
      net.ipv4.conf.all.rp_filter={{ 0 if isucon_node.role == 'router' else 1 }}
      net.ipv4.conf.default.rp_filter={{ 0 if isucon_node.role == 'router' else 1 }}
      net.ipv6.conf.all.forwarding=0

- name: Apply deterministic interface addresses and routes
  ansible.builtin.command: /usr/local/sbin/isureal-network-apply
  changed_when: false

- name: Install scoped guest firewall command
  ansible.builtin.template:
    src: firewall-apply.sh.j2
    dest: /usr/local/sbin/isureal-firewall-apply
    owner: root
    group: root
    mode: "0755"

- name: Install boot-time network policy unit
  ansible.builtin.template:
    src: isureal-network.service.j2
    dest: /etc/systemd/system/isureal-network.service
    owner: root
    group: root
    mode: "0644"

- name: Enable deterministic network policy at boot
  ansible.builtin.systemd_service:
    name: isureal-network.service
    enabled: true
    daemon_reload: true

- name: Apply scoped guest firewall
  ansible.builtin.command: /usr/local/sbin/isureal-firewall-apply
  changed_when: false

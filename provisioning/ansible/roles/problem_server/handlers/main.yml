---
- name: Reload systemd for problem server
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart problem-server application
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - isureal-api.service
    - isureal-worker.service
    - nginx.service
  when: not (isucon_image_build | bool) and isucon_node_id != 'db1'

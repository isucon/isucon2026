---
- name: Validate supported guest platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version == '24.04'
      - ansible_facts.architecture == "x86_64"
    fail_msg: "Only Ubuntu 24.04 amd64 guests are supported."

- name: Load the pinned release manifest on the controller
  ansible.builtin.set_fact:
    isucon_release_manifest: "{{ lookup('ansible.builtin.file', isucon_release_manifest_path) | from_json }}"
  no_log: false

- name: Validate the release architecture and database contract
  ansible.builtin.assert:
    that:
      - isucon_release_manifest.schemaVersion == 3
      - isucon_release_manifest.ubuntu.release == "24.04"
      - isucon_release_manifest.ubuntu.installImages.keys() | list == ["amd64"]
      - isucon_release_manifest.ubuntu.cloudImages.keys() | list == ["amd64"]
      - isucon_release_manifest.databaseContract.engine == "postgresql"
      - isucon_release_manifest.databaseContract.majorVersion == 16

- name: Disable unattended package mutation
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";

- name: Install common runtime packages
  ansible.builtin.apt:
    name:
      - "ca-certificates={{ (isucon_release_manifest.packages | selectattr('name', 'equalto', 'ca-certificates') | first).version }}"
      - curl
      - "iproute2={{ (isucon_release_manifest.packages | selectattr('name', 'equalto', 'iproute2') | first).version }}"
      - jq
      - "nftables={{ (isucon_release_manifest.packages | selectattr('name', 'equalto', 'nftables') | first).version }}"
      - python3
      - python3-apt
      - rsync
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    lock_timeout: 300

- name: Create common ISUCON directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/isucon, mode: "0755"}
    - {path: /opt/isucon, mode: "0755"}
    - {path: /var/lib/isucon, mode: "0755"}

- name: Install the immutable release manifest
  ansible.builtin.copy:
    src: "{{ isucon_release_manifest_path }}"
    dest: /etc/isucon/release.json
    owner: root
    group: root
    mode: "0644"

- name: Link the system timezone to UTC
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Etc/UTC
    dest: /etc/localtime
    state: link
    force: true

- name: Record UTC timezone
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "Etc/UTC\n"
    owner: root
    group: root
    mode: "0644"

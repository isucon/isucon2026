---
# rustup で Rust を isucon ユーザーの既定の場所（~/.rustup、~/.cargo）に入れる（webapp/rust 用）
- name: Install the linker for Rust
  ansible.builtin.apt:
    name: [gcc, libc6-dev]

- name: Read installed Rust version
  ansible.builtin.command:
    argv: [/home/isucon/.cargo/bin/rustc, --version]
  become_user: isucon
  register: rust_installed
  changed_when: false
  failed_when: false

- name: Install Rust
  when: rust_installed.rc != 0 or not rust_installed.stdout.startswith('rustc ' ~ rust_version ~ ' ')
  block:
    - name: Download rustup-init
      ansible.builtin.get_url:
        url: "https://static.rust-lang.org/rustup/archive/{{ rustup_version }}/x86_64-unknown-linux-gnu/rustup-init"
        dest: /tmp/rustup-init
        mode: "0755"

    - name: Run rustup-init
      ansible.builtin.command:
        argv:
          - /tmp/rustup-init
          - -y
          - --no-modify-path
          - --profile=minimal
          - --default-toolchain={{ rust_version }}
          - --component=clippy,rustfmt
      become_user: isucon
      changed_when: true

- name: Add Rust to PATH
  ansible.builtin.lineinfile:
    path: /home/isucon/.profile
    line: 'export PATH=$HOME/.cargo/bin:$PATH'
    create: true
    owner: isucon
    group: isucon
    mode: "0644"

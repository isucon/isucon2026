schemaVersion: 2
environmentId: isureal-local
baseCidr: 192.168.60.0/24
domain: 127.0.0.1.nip.io
portal:
  mode: docker-compose
  composeFile: portal-mock/compose.yaml
  routerMode: external-router
  teamNumber: 1
  teamHash: local
  apiHostPort: 18082
  apiContainerPort: 8080
  uiHostAddress: 127.0.0.1
  uiHostPort: 15174
  uiContainerPort: 5174
clientForward:
  hostAddress: 127.0.0.1
  hostPort: 18080
  guestPort: 8080
  protocol: tcp
  autoCorrect: false
clientTlsForward:
  hostAddress: 127.0.0.1
  hostPort: 18443
  guestPort: 443
  protocol: tcp
  autoCorrect: false
sshPorts:
  app1: 2201
  app2: 2202
  app3: 2203
  router: 2204
  db1: 2205
resourceProfiles:
  compact:
    problemServer:
      cpus: 2
      memoryMiB: 1536
      diskGiB: 24
    router:
      cpus: 2
      memoryMiB: 1024
      diskGiB: 16
  full:
    problemServer:
      cpus: 4
      memoryMiB: 4096
      diskGiB: 40
    router:
      cpus: 2
      memoryMiB: 2048
      diskGiB: 20
defaultResourceProfile: compact

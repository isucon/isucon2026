services:
  mysql:
    image: mysql:8.0
    container_name: isuxportal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: isuxportal
      MYSQL_USER: isuxportal
      MYSQL_PASSWORD: isuxportal
    command: --default-time-zone=+00:00
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7
    container_name: isuxportal-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

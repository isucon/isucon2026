version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/isucon/isucon2026/portal/gen/pb
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/pb
    opt:
      - paths=source_relative
  # フロントエンド（React SPA）用の TypeScript バインディング
  - remote: buf.build/bufbuild/es:v2.0.0
    out: frontend/proto

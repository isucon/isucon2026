[ssh_connection]
pipelining=True
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100
[defaults]
host_key_checking = True


stdout_callback = default
callbacks_enabled = profile_tasks

[privilege_escalation]
# Ubuntu 26.04 のデフォルト sudo は sudo-rs で、ansible のカスタムプロンプト (-p) に
# 対応していないため、従来の sudo (sudo.ws) を使う
# (sudo.ws は sudo パッケージとしてプリインストールされている)
become_exe = sudo.ws

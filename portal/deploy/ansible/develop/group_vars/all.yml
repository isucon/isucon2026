# develop（contest-dev.isucon.net）の設定。
# 秘密値は `CHANGEME` のままだと app role の assert で止まる。
# ansible-vault で暗号化して書く:
#   uv run ansible-vault encrypt_string --vault-password-file ./vault-pass.sh '<値>' --name '<name>'

# terraform の TF_VAR_initial_password と同じ値を環境変数で渡す。init role 実行後（admin ユーザ）は使われない
ansible_sudo_pass: "{{ lookup('env', 'PORTAL_INITIAL_PASSWORD') }}"
stage: develop

users:
  - username: admin
    # TODO: 運用者の SSH 公開鍵（複数行可）
    authorized_keys: |
      CHANGEME

app_fqdn: contest-dev.isucon.net

docker:
  docker_min_version: "27.3.1"
  registry:
    host: isucon.sakuracr.jp
    username: deploy
    password: CHANGEME   # pull 用アカウントのパスワード（vault）

# GitHub Actions からデプロイする github ユーザの公開鍵（秘密鍵は repo secret PORTAL_DEPLOY_SSH_KEY）
github_deploy_authorized_keys: |
  CHANGEME

app:
  # main への push で Build portal image が push する develop タグを使う
  image: isucon.sakuracr.jp/isucon2026-contest-portal:develop
  # Docker Swarm のスタック名。サービス名は <stack>_portal などになる
  stack: portal

postgres:
  image: postgres:16-alpine
  database: isuxportal
  user: isuxportal
  password: CHANGEME   # vault

redis:
  image: redis:7-alpine

portal:
  # ISUXPORTAL_* にそのまま流し込む（portal/internal/config/config.go）
  session_secret: CHANGEME   # vault。例: openssl rand -base64 48
  bypass_secret: CHANGEME    # vault。base64 32 bytes: openssl rand -base64 32
  checker_secret: CHANGEME   # vault。base64 32 bytes: openssl rand -base64 32
  bench_token: CHANGEME      # vault。ベンチマーカーが /api/bench/* に付ける共有トークン
  ssh_key_api_secret: CHANGEME   # vault。/api/ssh_public_keys の token
  admin_login: admin
  admin_password: CHANGEME   # vault
  admin_only: false          # true でリハーサル用の運営限定モード（ISUXPORTAL_ADMIN_ONLY）
  max_teams: 600

  github:
    # callback: https://{{ app_fqdn }}/auth/github/callback
    client_id: CHANGEME
    client_secret: CHANGEME   # vault
  discord:
    # OAuth redirect: https://{{ app_fqdn }}/auth/discord/callback
    client_id: CHANGEME
    client_secret: CHANGEME   # vault
    bot_token: ""             # vault。空なら bot サービスを起動しない
    server_id: ""
    channel_id: ""
    contestant_role_id: ""
    admin_role_id: ""
    # "channel_id=role_id,channel_id=role_id"
    support_comm_channel_roles: ""

  slack_webhook_url: ""       # vault。空なら Slack 通知を出さない
  sentry_dsn: ""

  vapid:
    # JSON 文字列化した PEM（CT-10）。空なら Web Push を配信しない
    private_key_json: ""
    subject: "isucon10@googlegroups.com"

  # 選手環境（EC2 / CloudFormation）とアイコン保存先（S3）は AWS のまま
  aws:
    region: ap-northeast-1
    access_key_id: ""          # vault。空なら presign / EC2 同期が動かない
    secret_access_key: ""      # vault
    avatar_bucket: ""
    avatar_base_path: "avatars/"
    test_ami_id: ""
    contest_ami_id: ""
    cloudformation_staging: true

  # 競技時刻（RFC3339、UTC）。空なら未設定（競技中扱い）
  timing:
    registration_open: ""
    registration_close: ""
    registration_invitation_close: ""
    registration_update_close: ""
    contest_start: ""
    contest_freeze: ""
    contest_end: ""

  terms_url: "https://isucon.net/archives/58657108.html"
  rules_url: "https://isucon.net/archives/58657116.html"
  docs_url: ""

server {
	listen 80;
	listen [::]:80;

	server_name {{ app_fqdn }};

	client_max_body_size 10m;

	# TLS はエンハンスド LB が終端し、HTTP(80) は HTTPS へリダイレクトされるので
	# ここに来るリクエストはすべて https 由来。portal の baseURL 判定（OAuth callback）に使う
	proxy_set_header Host $http_host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_read_timeout 60s;

	# notifyloop が stack 内から直接叩く。認証が無いので外からは閉じる
	location = /admin/long_running_check {
		return 404;
	}

	# テストモード専用フック。本番では無効だが念のため閉じる
	location /debug/ {
		return 404;
	}

	location / {
		proxy_pass http://127.0.0.1:8080;
	}

	location /_health {
		return 200;
	}
}

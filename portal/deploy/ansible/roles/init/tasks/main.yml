---
- name: Set hostname
  hostname:
    name: '{{ inventory_hostname }}'

# Existing SSH access is retained. Additional administrators are explicitly configured.
- name: Create administrators
  user:
    name: '{{ item.username }}'
    shell: /bin/bash
    groups: adm,sudo
    append: true
  loop: '{{ users }}'

- name: Install administrator public keys
  ansible.posix.authorized_key:
    user: '{{ item.username }}'
    key: '{{ item.authorized_keys }}'
  loop: '{{ users }}'

- name: Allow configured administrators to use sudo
  copy:
    content: "{{ item.username }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: '/etc/sudoers.d/portal-{{ item.username }}'
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  loop: '{{ users }}'

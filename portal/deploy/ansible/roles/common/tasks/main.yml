---
################################################################################
# baselines
################################################################################
- name: 'set hostname'
  tags: ['common', 'common_baseline']
  hostname:
    name: "{{ inventory_hostname }}"

- name: 'upgrade all packages to the latest'
  tags: ['common', 'common_baseline']
  apt:
    update_cache: 'true'
    upgrade: 'dist'

- name: 'install basic packages'
  tags: ['common', 'common_baseline']
  apt:
    state: 'latest'
    update_cache: 'yes'
    name:
      - 'curl'
      - 'vim'
      - 'lsb-release'
      - 'gnupg'
      - 'python3'
      - 'python3-pip'
      - 'python-is-python3'
      - 'fail2ban'

- name: configure bash profile
  template: src=bash_profile.j2 dest=/home/{{ item.username }}/.bash_profile owner={{ item.username }} group={{ item.username }} mode=0644
  with_items:
    - "{{ users }}"
  tags: ['common', 'common_baseline', 'users']

- name: configure logrotate
  template:
    src: "logrotate.d/{{ item }}"
    dest: "/etc/logrotate.d/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_items:
    - "rsyslog"
  tags: ['common', 'common_baseline', 'logrotate']

- name: Create netplan config for eth1 if eth1_address is defined
  copy:
    dest: /etc/netplan/01-eth1.yaml
    content: |
      network:
        version: 2
        ethernets:
          eth1:
            dhcp4: no
            addresses:
              - {{ sacloud_interfaces[1].UserIPAddress }}/24
  when: sacloud_interfaces | length >= 2
  tags: ['common', 'netplan']
  notify: netplan apply

- name: Remove netplan config for eth1 if eth1_address is not defined
  file:
    path: /etc/netplan/01-eth1.yaml
    state: absent
  when: sacloud_interfaces | length <= 1
  tags: ['common', 'netplan']
  notify: netplan apply

# package auto update settings
- name: create 50unattended-upgrades config
  template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: 0644
  tags: unattended-upgrades
  notify: restart unattended-upgrades

# ulimit settings
- name: Set ulimit soft value
  community.general.pam_limits:
    domain: '*'
    limit_type: soft
    limit_item: nofile
    value: 65535
  tags: ulimit

- name: Set ulimit hard value
  community.general.pam_limits:
    domain: '*'
    limit_type: hard
    limit_item: nofile
    value: 65535
  tags: ulimit
  

# sysctl settings
- name: Set sysctl params
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  with_items:
    - { name: "net.core.somaxconn", value: "4096" }
    - { name: "net.core.netdev_max_backlog", value: "4096" }
    - { name: "net.ipv4.tcp_max_syn_backlog", value: "4096" }
    - { name: "net.ipv4.tcp_tw_reuse", value: "1" }
    - { name: "net.ipv4.tcp_fin_timeout", value: "30" }
  tags: sysctl

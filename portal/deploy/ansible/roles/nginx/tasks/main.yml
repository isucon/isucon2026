---
- name: Install repository prerequisites
  apt:
    name: [ca-certificates, gnupg, curl]
    state: present

- name: Download nginx signing keys
  get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /usr/share/keyrings/nginx-signing.asc
    mode: '0644'

- name: Verify nginx signing key fingerprint
  command: gpg --show-keys --with-colons /usr/share/keyrings/nginx-signing.asc
  register: nginx_signing_keys
  changed_when: false
  failed_when: "'573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62' not in nginx_signing_keys.stdout"
  when: not ansible_check_mode

- name: Configure official stable repository
  copy:
    dest: /etc/apt/sources.list.d/nginx.list
    mode: '0644'
    content: |
      deb [signed-by=/usr/share/keyrings/nginx-signing.asc] https://nginx.org/packages/ubuntu resolute nginx

- name: Prefer official nginx packages
  copy:
    dest: /etc/apt/preferences.d/99nginx
    mode: '0644'
    content: |
      Package: nginx*
      Pin: origin nginx.org
      Pin-Priority: 900

- name: Install nginx stable release
  apt:
    name: 'nginx={{ nginx_version }}-*'
    state: present
    update_cache: true
  notify: reload nginx

- name: Install nginx configuration
  template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  notify: reload nginx

- name: Remove old managed sites
  file:
    path: '{{ item }}'
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-enabled/portal
    - /etc/nginx/conf.d/default.conf
  notify: reload nginx

- name: Enable nginx
  service:
    name: nginx
    enabled: true
    state: started

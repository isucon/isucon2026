---
- name: Create private configuration directory
  file:
    path: /opt/portal
    state: directory
    mode: '0700'

- name: Install credential bootstrap
  copy:
    src: ensure_secrets.py
    dest: /opt/portal/ensure_secrets.py
    mode: '0700'

- name: Preserve or generate credentials
  command: python3 /opt/portal/ensure_secrets.py /opt/portal
  register: credential_bootstrap
  changed_when: "'CREATED' in credential_bootstrap.stdout"
  no_log: true

- name: Read persistent credentials
  slurp:
    src: /opt/portal/secrets.json
  register: credential_file
  no_log: true
  when: not ansible_check_mode

- name: Read credentials in check mode if already provisioned
  slurp:
    src: /opt/portal/secrets.json
  register: check_credential_file
  when: ansible_check_mode
  no_log: true
  failed_when: false

- name: Resolve configuration
  set_fact:
    app: "{{ app_defaults | combine(app_overrides | default({}), recursive=true) }}"
    postgres: "{{ postgres_defaults | combine(saved.postgres | default({'password': 'check-mode-placeholder'}), recursive=true) | combine(postgres_overrides | default({}), recursive=true) }}"
    redis: "{{ redis_defaults | combine(redis_overrides | default({}), recursive=true) }}"
    portal: "{{ portal_defaults | combine(saved.portal | default({}), recursive=true) | combine(portal_overrides | default({}), recursive=true) }}"
  vars:
    saved: "{{ ((check_credential_file if ansible_check_mode else credential_file).content | default('e30=') | b64decode | from_json) }}"
  no_log: true

- name: Validate deployment inputs
  assert:
    that:
      - app.mode in ['local', 'registry']
      - app.stack is match('^[a-z][a-z0-9_-]*$')
      - postgres.user is match('^[a-z_][a-z0-9_]*$')
      - postgres.database is match('^[a-z_][a-z0-9_]*$')
      - "'$' not in postgres.password"
      - "'\n' not in postgres.password"
      - app_fqdn is match('^[a-zA-Z0-9.-]+$')
      - app.mode != 'registry' or app.image | length > 0
      - portal.admin_only or portal.timing.registration_open | length > 0
      - portal.admin_only or portal.timing.registration_close | length > 0
    fail_msg: Check overrides; public mode requires explicit registration dates.
  no_log: true

- name: Require nonempty internal credentials
  assert:
    that:
      - item is string
      - item | length > 0
      - item != 'CHANGEME'
  loop:
    - '{{ postgres.password }}'
    - '{{ portal.session_secret }}'
    - '{{ portal.bypass_secret }}'
    - '{{ portal.checker_secret }}'
    - '{{ portal.bench_token }}'
    - '{{ portal.ssh_key_api_secret }}'
    - '{{ portal.admin_password }}'
  no_log: true
  when: not ansible_check_mode

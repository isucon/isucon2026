---
- hosts: all
  become: yes
  module_defaults:
    apt:
      cache_valid_time: 86400
  roles:
    - init
    - common

- hosts: class=app
  become: yes
  module_defaults:
    apt:
      cache_valid_time: 86400
  roles:
    - docker
    - nginx
    - app
    - ghactions

- hosts: all
  become: yes
  gather_facts: false
  roles:
    - role: show_ansible_check_mode
      run_once: true

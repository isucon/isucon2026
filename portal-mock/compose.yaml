name: portal-mock

services:
  server:
    build:
      context: ..
      dockerfile: portal-mock/server/Dockerfile
    environment:
      PORTAL_TEAM_NUMBER: ${PORTAL_TEAM_NUMBER:-1}
      PORTAL_TEAM_HASH: ${PORTAL_TEAM_HASH:-abc123}
      PORTAL_DOMAIN_SUFFIX: ${PORTAL_DOMAIN_SUFFIX:-isucon2026.westens.tokyo}
      PORTAL_ROUTER_MODE: ${PORTAL_ROUTER_MODE:-stand-in}
      PORTAL_STANDIN_PROFILE: ${PORTAL_STANDIN_PROFILE:-success}
      PORTAL_APPLY_TIMEOUT_MS: ${PORTAL_APPLY_TIMEOUT_MS:-3000}
      PORTAL_STANDIN_DELAY_MS: ${PORTAL_STANDIN_DELAY_MS:-100}
      PORTAL_STANDIN_RETRY_MS: ${PORTAL_STANDIN_RETRY_MS:-150}
      PORTAL_BENCHMARK_PENDING_MS: ${PORTAL_BENCHMARK_PENDING_MS:-200}
      PORTAL_BENCHMARK_STEP_MS: ${PORTAL_BENCHMARK_STEP_MS:-120}
      PORTAL_LISTEN_ADDRESS: 0.0.0.0:8080
      PORTAL_WEB_DIR: ""
    ports:
      - "${PORTAL_SERVER_BIND_IP:-127.0.0.1}:${PORTAL_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: portal-mock/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${PORTAL_WEB_BIND_IP:-127.0.0.1}:${PORTAL_WEB_PORT:-5174}:5174"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5174/"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

user nginx;
worker_processes auto;

error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream portal_server {
        server server:8080;
        keepalive 16;
    }

    server {
        listen 5174;
        listen [::]:5174;
        root /usr/share/nginx/html;
        index index.html;

        location = /health/ready {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ready\n';
        }

        # Connect/Connect-ES の unary と server-streaming を同一 origin で中継する。
        # URI を書き換えず、stream の buffering と cache を無効化する。
        location ~ ^/(portal\.v1\.PortalRouterService|portal_mock\.v1\.PortalMockService)/ {
            proxy_pass http://portal_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            add_header X-Accel-Buffering no always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:js|css|svg|png|webp|woff2?)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

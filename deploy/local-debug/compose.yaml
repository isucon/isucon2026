name: isureal-debug

x-portal-environment: &portal-environment
  ISUXPORTAL_DATABASE_URL: postgres://isuxportal:isuxportal@portal-db:5432/isuxportal?sslmode=disable
  REDIS_URL: redis://portal-redis:6379/0
  PORTAL_LISTEN: :8081
  PORTAL_AUTO_MIGRATE: "1"
  PORTAL_TEST_MODE: "0"
  PORTAL_LOCAL_DEBUG: "1"
  PORTAL_LOCAL_ENDPOINT: http://portal:8081
  PORTAL_LOCAL_TARGET: api
  ISUXPORTAL_BENCH_TOKEN: local-debug-bench-token
  ISUXPORTAL_SESSION_SECRET: local-debug-session-secret
  ISUXPORTAL_ADMIN_LOGIN: admin
  ISUXPORTAL_ADMIN_PASSWORD: local-debug-password
  DEFAULT_URL_HOST: localhost:${DEBUG_PORTAL_PORT:-18081}
  ISUXPORTAL_TIMING_CONTEST_START: "${DEBUG_CONTEST_START:-2020-01-01T00:00:00Z}"
  ISUXPORTAL_TIMING_CONTEST_FREEZE: "${DEBUG_CONTEST_FREEZE:-2099-01-01T00:00:00Z}"
  ISUXPORTAL_TIMING_CONTEST_END: "${DEBUG_CONTEST_END:-2099-01-02T00:00:00Z}"
  AWS_EC2_METADATA_DISABLED: "true"

services:
  postgres:
    extends:
      file: ../../compose.yaml
      service: postgres
    ports: !reset []
  init:
    extends:
      file: ../../compose.yaml
      service: init
  api:
    extends:
      file: ../../compose.yaml
      service: api
    ports: !override ["127.0.0.1:${DEBUG_API_PORT:-18080}:8080"]
    environment:
      ISUREAL_PUBLIC_ORIGIN: http://localhost:${DEBUG_WEB_PORT:-15173}
  worker:
    extends:
      file: ../../compose.yaml
      service: worker
    environment:
      ISUREAL_PUBLIC_ORIGIN: http://localhost:${DEBUG_WEB_PORT:-15173}
  frontend:
    extends:
      file: ../../compose.yaml
      service: frontend
    ports: !override ["127.0.0.1:${DEBUG_WEB_PORT:-15173}:5173"]

  portal-db:
    image: mirror.gcr.io/library/postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    environment:
      POSTGRES_DB: isuxportal
      POSTGRES_USER: isuxportal
      POSTGRES_PASSWORD: isuxportal
    volumes: [portal-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U isuxportal -d isuxportal]
      interval: 2s
      timeout: 2s
      retries: 30
  portal-redis:
    image: mirror.gcr.io/library/redis:7
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  portal:
    build:
      context: ../..
      dockerfile: deploy/local-debug/portal.Dockerfile
    environment: *portal-environment
    ports: ["127.0.0.1:${DEBUG_PORTAL_PORT:-18081}:8081"]
    depends_on:
      portal-db: {condition: service_healthy}
      portal-redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/site/sha]
      interval: 2s
      timeout: 2s
      retries: 60
  portal-worker:
    build:
      context: ../..
      dockerfile: deploy/local-debug/portal.Dockerfile
    command: [/opt/portal/bin/worker]
    environment: *portal-environment
    depends_on:
      portal: {condition: service_healthy}
  supervisor:
    build:
      context: ../..
      dockerfile: supervisor/Dockerfile
    init: true
    environment:
      ISUXPORTAL_SUPERVISOR_ENDPOINT_URL: http://portal:8081
      ISUXPORTAL_SUPERVISOR_TOKEN: local-debug-bench-token
      ISUXPORTAL_SUPERVISOR_INSTANCE_NAME: apne1-az1
      ISUXPORTAL_SUPERVISOR_HARD_TIMEOUT: "210"
      ISUXPORTAL_SUPERVISOR_INTERVAL_AFTER_EMPTY_RECEIVE: "1"
    command: [/usr/local/bin/isureal-bench, --target-port, "8080", -users, "2", -cycles, "${DEBUG_BENCH_CYCLES:-1}"]
    volumes: [supervisor-logs:/var/log/isuxportal-supervisor]
    stop_grace_period: 180s
    depends_on:
      portal: {condition: service_healthy}
      api: {condition: service_healthy}
      worker: {condition: service_started}

volumes:
  postgres-data:
  image-data:
  portal-db:
  supervisor-logs:

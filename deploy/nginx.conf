server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=30s ipv6=off;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:" always;
  add_header Permissions-Policy "camera=(self)" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /service-worker.js {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}

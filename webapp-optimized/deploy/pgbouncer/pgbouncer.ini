; PgBouncer on db1 for the overseas apps (ISUREAL_DB_PORT=6432). Each of them
; keeps about 96 connections because every query waits a round trip from
; overseas, but a server connection is needed only while a transaction runs.
; Transaction pooling lets them share a few backends, which frees about 2 GB
; of backend memory on db1 for the page cache.
;
; plan_cache_mode cannot pass through PgBouncer; set it on the role instead:
;   ALTER ROLE isureal SET plan_cache_mode = 'force_generic_plan';
[databases]
isureal = host=127.0.0.1 port=5432 dbname=isureal

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 24
reserve_pool_size = 0
max_prepared_statements = 1000
ignore_startup_parameters = extra_float_digits,plan_cache_mode
server_tls_sslmode = disable
client_tls_sslmode = disable
server_idle_timeout = 600
log_connections = 0
log_disconnections = 0
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
admin_users = postgres

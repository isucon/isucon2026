# PostgreSQL 16 settings for the optimized app on db1 (2 vCPU / 3.8 GiB, gp3).
# Install as /etc/postgresql/16/main/conf.d/isucon.conf and restart PostgreSQL.
listen_addresses = '*'
max_connections = 300

# About an eighth of RAM keeps the hot indexes (sessions, posts, notifications) in
# shared buffers (each backend also needs several MB of private memory and the
# three apps hold up to 96 connections), where the clock sweep resists eviction by the history
# readers' image scans better than the kernel page cache does.
shared_buffers = 512MB
effective_cache_size = 2500MB
work_mem = 4MB
maintenance_work_mem = 256MB

# gp3: random reads cost about the same as sequential ones, and many can be
# in flight.
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# Fewer, larger checkpoints: the load writes images and WAL at tens of MB/s.
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_buffers = 64MB

# Short statements only; JIT setup costs more than it saves.
jit = off
# Statement statistics for tuning (CREATE EXTENSION pg_stat_statements once).
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
log_min_duration_statement = 1000
log_lock_waits = on

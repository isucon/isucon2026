openapi: 3.1.0
info:
  title: ISUReal API
  version: 0.1.2
  description: |
    ISURealアプリの公開HTTP契約。時刻はRFC 3339 UTC、IDはUUID、一覧上限は常に50件。
    読み取り専用操作を除くすべてのPOST/PUT/PATCH/DELETEはIdempotency-Keyを必須とする。
    FR-044により認証トークンはAuthorization Bearerヘッダーだけから受理し、Cookie、query、form bodyからは受理しない。
    ブラウザの状態変更要求は設定済み公開Originとsame-origin Fetch Metadataに限定し、CORSを許可しない。
x-browser-security-boundary:
  browserStateChanges:
    origin: exact-configured-public-origin-when-present
    secFetchSite: same-origin-when-present
  headerlessNonBrowserClients: allowed-with-normal-authentication-and-authorization
  cors: denied
  protectedResponseHeaders:
    Cache-Control: no-store
    Pragma: no-cache
    Referrer-Policy: no-referrer
    X-Content-Type-Options: nosniff
  spaPolicy:
    contentSecurityPolicy: "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; worker-src 'self'"
    permissionsPolicy: camera=(self)
servers:
  - url: /api/v1
security:
  - userBearer: []
tags:
  - name: auth
  - name: profile
  - name: relationships
  - name: posts
  - name: interactions
  - name: notifications
  - name: admin

paths:
  /auth/register:
    post:
      tags: [auth]
      security: []
      operationId: register
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionCreated' }
        '401':
          description: ユーザー不存在とパスワード不一致で同一応答
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: セッションと購読を無効化 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me:
    get:
      tags: [profile]
      operationId: getMe
      responses:
        '200':
          description: 本人プロフィール
          content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } }
    patch:
      tags: [profile]
      operationId: updateMe
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string, minLength: 1, maxLength: 100 }
                bio: { type: string, maxLength: 500 }
                region: { $ref: '#/components/schemas/Region' }
              minProperties: 1
      responses:
        '200':
          description: 更新済み（進行中期間ではregionはpendingRegionへ反映）
          content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/profile-image:
    put:
      tags: [profile]
      operationId: putProfileImage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 2097152 }
      responses:
        '204': { description: メタデータ除去済み画像へ置換 }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [profile]
      operationId: deleteProfileImage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: 未設定化 }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/account-deletion:
    post:
      tags: [profile]
      operationId: requestAccountDeletion
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202':
          description: 削除猶予へ移行しセッションを無効化
          content:
            application/json:
              schema:
                type: object
                required: [purgeDueAt]
                properties: { purgeDueAt: { type: string, format: date-time } }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/push-subscription:
    put:
      tags: [notifications]
      operationId: replacePushSubscription
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses:
        '204': { description: 現セッションの有効購読を原子的に置換 }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [notifications]
      operationId: removePushSubscription
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: 購読解除 }
        '409': { $ref: '#/components/responses/Conflict' }

  /users:
    get:
      tags: [profile]
      operationId: searchUsers
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: username正規化値昇順、ID昇順
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /users/{userId}:
    get:
      tags: [profile]
      operationId: getUser
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: 認可済みプロフィール
          content: { application/json: { schema: { $ref: '#/components/schemas/UserSummary' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /friend-requests:
    post:
      tags: [relationships]
      operationId: createFriendRequest
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId]
              properties: { recipientId: { type: string, format: uuid } }
      responses:
        '201': { description: pending申請または相互申請で成立したfriendship }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /friend-requests/{requestId}/{action}:
    post:
      tags: [relationships]
      operationId: transitionFriendRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [accept, reject, cancel] }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 変更後の関係状態 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /relationships/{kind}:
    get:
      tags: [relationships]
      operationId: listRelationships
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [friends, following, followers, incoming-requests, outgoing-requests] }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: updatedAt降順、relationId降順。申請一覧はpendingのみ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationshipPage' }
  /friendships/{userId}:
    delete:
      tags: [relationships]
      operationId: deleteFriendship
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 双方向関係を解除 }
        '409': { $ref: '#/components/responses/Conflict' }
  /follows/{userId}:
    put:
      tags: [relationships]
      operationId: followUser
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 認定公開アカウントへの一方向follow成立 }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [relationships]
      operationId: unfollowUser
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: follow解除 }
        '409': { $ref: '#/components/responses/Conflict' }
  /blocks/{userId}:
    put:
      tags: [relationships]
      operationId: blockUser
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 関係/申請を解除し双方向の閲覧交流を禁止 }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [relationships]
      operationId: unblockUser
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 自分が作成したblockのみ解除。関係は復元しない }
        '409': { $ref: '#/components/responses/Conflict' }

  /posting-window/current:
    get:
      tags: [posts]
      operationId: getCurrentPostingWindow
      responses:
        '200':
          description: 自身の地域の現在期間と投稿状態。期間なしはwindow=null
          content:
            application/json:
              schema:
                type: object
                required: [window, hasPosted, canPost]
                properties:
                  window: { anyOf: [{ $ref: '#/components/schemas/PostingWindow' }, { type: 'null' }] }
                  hasPosted: { type: boolean }
                  canPost: { type: boolean }
                  deletionCount: { type: integer, minimum: 0, maximum: 2 }
  /posts:
    post:
      tags: [posts]
      operationId: createPost
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, visibility, location]
              properties:
                image: { type: string, format: binary, description: JPEG、最大10 MiB }
                caption: { type: string, maxLength: 1000, default: '' }
                visibility: { $ref: '#/components/schemas/Visibility' }
                location: { $ref: '#/components/schemas/LocationInput' }
            encoding:
              location: { contentType: application/json }
      responses:
        '201':
          description: 投稿成立
          content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /posts/me/current:
    get:
      tags: [posts]
      operationId: getMyCurrentPost
      responses:
        '200':
          description: 自分の現在投稿
          content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /images/{imageId}:
    get:
      tags: [images]
      operationId: getAuthorizedImage
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 閲覧権限を確認済みのJPEG画像
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /posts/{postId}:
    get:
      tags: [posts]
      operationId: getPost
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      responses:
        '200': { description: 現在認可された投稿, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [posts]
      operationId: updatePost
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                caption: { type: string, maxLength: 1000 }
                visibility: { $ref: '#/components/schemas/Visibility' }
              minProperties: 1
      responses:
        '200': { description: 現行期間中の本人更新, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [posts]
      operationId: deletePost
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 本人削除。関連内容を即時不可視化し削除回数を加算 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /feeds/{feed}:
    get:
      tags: [posts]
      operationId: getFeed
      parameters:
        - name: feed
          in: path
          required: true
          schema: { type: string, enum: [friends, friends-of-friends, public, following] }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: postedAt降順、postId降順。本人投稿は除外
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /memories:
    get:
      tags: [posts]
      operationId: getMemories
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 本人のみ、postedAt降順、postId降順。交流を含む
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
  /memories/{date}:
    get:
      tags: [posts]
      operationId: getMemoriesByDate
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
          description: 投稿期間開始時に確定した地域別カレンダー日
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 指定地域日へ属する本人投稿だけをpostedAt降順、postId降順で返す
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }

  /posts/{postId}/realmojis:
    get:
      tags: [interactions]
      operationId: listRealMojis
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: createdAt降順、ID降順の有効なRealMoji
          content: { application/json: { schema: { $ref: '#/components/schemas/RealMojiPage' } } }
    post:
      tags: [interactions]
      operationId: replaceRealMoji
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [reactionType, image]
              properties:
                reactionType: { $ref: '#/components/schemas/ReactionType' }
                image: { type: string, format: binary, description: JPEG、最大2 MiB }
      responses:
        '201': { description: 旧有効RealMojiを置換した新規ID }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /realmojis/{realMojiId}:
    delete:
      tags: [interactions]
      operationId: deleteRealMoji
      parameters:
        - name: realMojiId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 送信者または投稿者が削除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /posts/{postId}/comments:
    get:
      tags: [interactions]
      operationId: listComments
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: createdAt昇順、ID昇順
          content: { application/json: { schema: { $ref: '#/components/schemas/CommentPage' } } }
    post:
      tags: [interactions]
      operationId: createComment
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string, minLength: 1, maxLength: 1000 } }
      responses:
        '201': { description: コメント成立 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /comments/{commentId}:
    delete:
      tags: [interactions]
      operationId: deleteComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 送信者または投稿者が削除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters: [{ $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: createdAt降順、ID降順
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } }
  /notifications/{notificationId}/open:
    post:
      tags: [notifications]
      operationId: openNotification
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 本人通知を既読化し、現在状態に応じた遷移先を返す
          content:
            application/json:
              schema:
                type: object
                required: [destination]
                properties:
                  destination: { type: string, enum: [create-post, my-current-post, memory] }
                  path: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/auth/login:
    post:
      tags: [admin]
      security: []
      operationId: adminLogin
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminSessionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/regions/{region}/schedule:
    put:
      tags: [admin]
      security: [{ adminBearer: [] }]
      operationId: setNotificationSchedule
      parameters:
        - $ref: '#/components/parameters/RegionPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt]
              properties: { scheduledAt: { type: string, format: date-time } }
      responses:
        '200': { description: 設定/開始前変更 }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin]
      security: [{ adminBearer: [] }]
      operationId: cancelNotificationSchedule
      parameters:
        - $ref: '#/components/parameters/RegionPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 開始前だけ取消 }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{userId}/certification:
    put:
      tags: [admin]
      security: [{ adminBearer: [] }]
      operationId: certifyUser
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: active regularを不可逆に認定 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin]
      security: [{ adminBearer: [] }]
      operationId: rejectCertificationRemoval
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '409':
          description: 認定公開状態は不可逆であり、認定状態と既存関係を変更せず拒否
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

components:
  securitySchemes:
    userBearer: { type: http, scheme: bearer, bearerFormat: opaque-session-token }
    adminBearer: { type: http, scheme: bearer, bearerFormat: opaque-admin-token }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: 認証済みは主体・operation、未認証の登録/ログインは認証種別・正規化済みユーザー名・operation内で最初の503以外の結果確定から24時間有効。同内容は確定結果を再現し、異内容は409。503は未確定として同じキーで再試行可能
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: 一覧種別に束縛された署名付き不透明カーソル
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegionPath:
      name: region
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Region' }
  responses:
    SessionCreated:
      description: 新しい唯一の有効セッション
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }
    AdminSessionCreated:
      description: 管理者セッション
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminSession' }
    BadRequest:
      description: 入力不正
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: 認証なし/無効セッション
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: 認可されない操作
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: 不存在または存在を秘匿すべき対象
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: 状態競合、重複、またはIdempotency-Key異内容再利用
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PayloadTooLarge:
      description: 用途別容量上限超過
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UnsupportedMedia:
      description: JPEGではない、またはデコード不能
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InternalError:
      description: アプリ内部の予期しない失敗。再試行可能とは限らない
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ServiceUnavailable:
      description: 再試行可能な一時的依存先障害、画像サニタイザ実行枠不足、資源上限到達、異常終了、またはタイムアウト
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string, minLength: 1, description: 同じ失敗条件で安定した機械判定用コード }
        correlationId: { type: string, format: uuid }
        errors: { type: array, items: { type: object } }
    Region:
      type: string
      enum: [america, europe, asia]
    Visibility:
      type: string
      enum: [friends, friends_of_friends, public]
    ReactionType:
      type: string
      enum: [like, smile, surprise, heart, laugh, instant]
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password, displayName, region]
      properties:
        username: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$' }
        password: { type: string, minLength: 8, maxLength: 72, pattern: '^[\x20-\x7E]+$' }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        region: { $ref: '#/components/schemas/Region' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    Session:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/UserDetail' }
    AdminSession:
      type: object
      required: [token, administratorId]
      properties:
        token: { type: string }
        administratorId: { type: string, format: uuid }
    UserSummary:
      type: object
      required: [id, username, displayName, accountType]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        profileImageUrl: { type: [string, 'null'], format: uri-reference }
        bio: { type: string, description: 認可時だけ含む }
        accountType: { type: string, enum: [regular, certified_public] }
        relationship: { type: object, additionalProperties: true }
    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [region, pendingRegion, status]
          properties:
            region: { $ref: '#/components/schemas/Region' }
            pendingRegion:
              anyOf: [{ $ref: '#/components/schemas/Region' }, { type: 'null' }]
            status: { type: string, enum: [active, deletion_pending] }
    UserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/UserSummary' } }
        nextCursor: { type: [string, 'null'] }
    RelationshipPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [relationId, user, status, updatedAt]
            properties:
              relationId: { type: string, format: uuid }
              user: { $ref: '#/components/schemas/UserSummary' }
              status: { type: string }
              updatedAt: { type: string, format: date-time }
        nextCursor: { type: [string, 'null'] }
    PostingWindow:
      type: object
      required: [id, region, localDate, startsAt, onTimeDeadline]
      properties:
        id: { type: string, format: uuid }
        region: { $ref: '#/components/schemas/Region' }
        localDate: { type: string, format: date }
        startsAt: { type: string, format: date-time }
        onTimeDeadline: { type: string, format: date-time }
    LocationInput:
      oneOf:
        - type: object
          required: [kind]
          additionalProperties: false
          properties: { kind: { const: none } }
        - type: object
          required: [kind, latitude, longitude]
          additionalProperties: false
          properties:
            kind: { const: exact }
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
        - type: object
          required: [kind, locality]
          additionalProperties: false
          properties:
            kind: { const: approximate }
            locality: { type: string, minLength: 1, maxLength: 100 }
    Post:
      type: object
      required: [id, author, postingWindowId, imageUrl, caption, visibility, location, postedAt, onTime, lateSeconds]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserSummary' }
        postingWindowId: { type: string, format: uuid }
        imageUrl: { type: string, format: uri-reference }
        caption: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        location: { $ref: '#/components/schemas/LocationInput' }
        postedAt: { type: string, format: date-time }
        onTime: { type: boolean }
        lateSeconds: { type: integer, minimum: 0 }
    PostPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Post' } }
        nextCursor: { type: [string, 'null'] }
    RealMoji:
      type: object
      required: [id, reactor, reactionType, imageUrl, createdAt]
      properties:
        id: { type: string, format: uuid }
        reactor: { $ref: '#/components/schemas/UserSummary' }
        reactionType: { $ref: '#/components/schemas/ReactionType' }
        imageUrl: { type: string, format: uri-reference }
        createdAt: { type: string, format: date-time }
    RealMojiPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/RealMoji' } }
        nextCursor: { type: [string, 'null'] }
    Comment:
      type: object
      required: [id, author, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserSummary' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    CommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Comment' } }
        nextCursor: { type: [string, 'null'] }
    Notification:
      type: object
      required: [id, postingWindowId, region, createdAt, read]
      properties:
        id: { type: string, format: uuid, description: アプリ内通知ID兼ブラウザPush論理通知ID }
        postingWindowId: { type: string, format: uuid }
        region: { $ref: '#/components/schemas/Region' }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Notification' } }
        nextCursor: { type: [string, 'null'] }
    PushSubscriptionInput:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
